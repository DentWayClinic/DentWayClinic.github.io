
<style>
:root {
  --green: #111111;
  --green2: #292929;
  --gold: #c9a646;
  --cream: #f7f5ef;
  --white: #ffffff;
  --text: #222222;
  --muted: #686868;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 100px; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  line-height: 1.7;
  background: var(--white);
}

a { color: inherit; text-decoration: none; }
button, select, input, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
.container { width: min(1160px, 92%); margin: auto; }

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,.98);
  border-bottom: 1px solid #d8c58a;
  backdrop-filter: blur(12px);
}

.nav {
  min-height: 105px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
  min-width: 0;
}

.brand img {
  width: 165px;
  height: 95px;
  object-fit: contain;
}

.brand-text {
  color: #111111;
  font-weight: 800;
  letter-spacing: 3px;
}

.brand-text small {
  display: block;
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 700;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 17px;
}

nav {
  display: flex;
  align-items: center;
  gap: 19px;
}

nav a {
  font-size: 13px;
  font-weight: 700;
  color: #171717;
}

nav a:hover { color: #a88728; }

#language {
  max-width: 112px;
  padding: 10px 8px;
  border: 1px solid var(--gold);
  border-radius: 8px;
  background: white;
  color: #111111;
  cursor: pointer;
}

.menu-button {
  display: none;
  border: 0;
  background: transparent;
  color: #111111;
  font-size: 27px;
  cursor: pointer;
}

/* HERO */
.hero {
  background: linear-gradient(120deg, #050505 0%, #171717 62%, #303030 100%);
  color: white;
  overflow: hidden;
  position: relative;
}

.hero::after {
  content: "";
  position: absolute;
  width: 440px;
  height: 440px;
  border: 1px solid rgba(201,166,70,.45);
  border-radius: 50%;
  right: -130px;
  top: -120px;
  pointer-events: none;
}

.hero-grid {
  min-height: 550px;
  padding: 85px 0;
  display: grid;
  grid-template-columns: 1.25fr .75fr;
  align-items: center;
  gap: 55px;
  position: relative;
  z-index: 1;
}

.eyebrow {
  text-transform: uppercase;
  color: var(--gold);
  letter-spacing: 2.5px;
  font-size: 12px;
  font-weight: 800;
}

h1 {
  font-size: clamp(40px, 5.6vw, 69px);
  line-height: 1.08;
  margin: 20px 0;
  letter-spacing: -2px;
}

h1 span { color: #dfc66f; }

.hero p {
  color: #e6e6e6;
  font-size: 17px;
  max-width: 600px;
}

.hero-art {
  min-height: 330px;
  border: 1px solid rgba(201,166,70,.5);
  border-radius: 190px 190px 24px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  background: radial-gradient(ellipse at center, #ffffff16, #ffffff03 65%);
}

.hero-art-inner {
  border: 1px solid rgba(201,166,70,.8);
  border-radius: 50%;
  width: 210px;
  height: 210px;
  display: grid;
  place-content: center;
}

.hero-art .tooth {
  font-size: 83px;
  line-height: 1.2;
  color: #dfc66f;
}

.hero-art small {
  color: #f0e3b7;
  letter-spacing: 2px;
  font-size: 10px;
}

/* BUTTONS */
.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  padding: 13px 21px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 800;
  border: 1px solid transparent;
  cursor: pointer;
  transition: .2s;
}

.btn-gold {
  background: var(--gold);
  color: #111111;
}

.btn-gold:hover {
  background: #dfc66f;
  transform: translateY(-1px);
}

.btn-outline {
  border-color: rgba(255,255,255,.65);
  color: white;
}

.btn-outline:hover {
  background: white;
  color: #111111;
}

.btn-green {
  background: #111111;
  color: white;
  border: 1px solid var(--gold);
}

.btn-green:hover { background: #303030; }

/* TRUST BAR */
.trust {
  padding: 25px 0;
  background: var(--cream);
}

.trust-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 25px;
}

.trust-item {
  display: flex;
  align-items: center;
  gap: 13px;
}

.trust-icon {
  color: var(--gold);
  font-size: 25px;
}

.trust-item strong {
  display: block;
  color: #111111;
  font-size: 14px;
}

.trust-item small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

/* SECTIONS */
section { padding: 85px 0; }

.section-head {
  max-width: 720px;
  margin: 0 auto 40px;
  text-align: center;
}

.section-head h2,
.about h2,
.contact h2 {
  color: #111111;
  font-size: clamp(30px, 4vw, 43px);
  line-height: 1.2;
  margin: 12px 0 17px;
  letter-spacing: -1px;
}

.section-head p,
.about p { color: var(--muted); }

/* TREATMENT CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
}

.card {
  padding: 27px;
  border: 1px solid #e5dfcf;
  border-radius: 12px;
  background: white;
  transition: transform .2s, box-shadow .2s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 35px #00000012;
}

.card-icon {
  width: 49px;
  height: 49px;
  display: grid;
  place-content: center;
  background: #f4eedf;
  color: #111111;
  border-radius: 10px;
  font-size: 24px;
  margin-bottom: 18px;
}

.card h3 {
  color: #111111;
  margin: 0 0 10px;
  font-size: 19px;
}

.card p {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 19px;
}

.card a {
  color: #8a6d20;
  font-size: 13px;
  font-weight: 800;
}

.card a:hover { color: #111111; }

/* ABOUT */
.about { background: var(--cream); }

.about-grid {
  display: grid;
  grid-template-columns: .85fr 1.15fr;
  gap: 65px;
  align-items: center;
}

.about-panel {
  min-height: 330px;
  border-radius: 14px;
  padding: 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  color: white;
  background: linear-gradient(145deg, #050505, #292929);
  border: 1px solid #c9a646;
}

.about-panel .big {
  color: #dfc66f;
  font-size: 51px;
  font-weight: 800;
  line-height: 1.2;
}

.about-panel p { color: #e6e6e6; }

.check-list { list-style: none; padding: 0; }

.check-list li { padding: 8px 0; }

.check-list li::before {
  content: "✓";
  color: #a88728;
  font-weight: 800;
  margin-right: 10px;
}

/* PATIENT JOURNEY */
.journey-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 18px;
}

.journey-step {
  padding: 23px 19px;
  border-top: 2px solid var(--gold);
  background: #faf9f5;
}

.journey-step .number {
  color: #a88728;
  font-size: 29px;
  font-weight: 800;
}

.journey-step h3 {
  color: #111111;
  font-size: 16px;
}

.journey-step p {
  color: var(--muted);
  font-size: 13px;
}

/* FAQ */
.faq { background: var(--cream); }

.faq-list {
  max-width: 820px;
  margin: auto;
}

details {
  background: white;
  border: 1px solid #e5dfcf;
  border-radius: 8px;
  padding: 17px 20px;
  margin: 10px 0;
}

summary {
  cursor: pointer;
  font-weight: 700;
  color: #111111;
}

details p {
  color: var(--muted);
  font-size: 14px;
}

/* CONTACT */
.contact-grid {
  display: grid;
  grid-template-columns: .85fr 1.15fr;
  gap: 45px;
  align-items: start;
}

.contact-info {
  background: #111111;
  color: white;
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 30px;
}

.contact-info h3 { color: #dfc66f; }
.contact-info p { color: #e6e6e6; }
.contact-info a { overflow-wrap: anywhere; }

.contact-form {
  display: grid;
  gap: 14px;
}

.contact-form label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: #111111;
}

.contact-form input,
.contact-form select,
.contact-form textarea {
  width: 100%;
  margin-top: 6px;
  padding: 12px;
  border: 1px solid #d8d1bd;
  border-radius: 6px;
  background: white;
  color: var(--text);
}

.contact-form input:focus,
.contact-form select:focus,
.contact-form textarea:focus {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
}

.contact-form textarea {
  min-height: 115px;
  resize: vertical;
}

.form-note {
  color: var(--muted);
  font-size: 12px;
}

/* FOOTER */
footer {
  background: #050505;
  color: white;
  padding: 35px 0 20px;
  border-top: 2px solid var(--gold);
}

.footer-grid {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 25px;
  flex-wrap: wrap;
}

.footer-brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.footer-brand img {
  width: 95px;
  height: 70px;
  object-fit: contain;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 17px;
  font-size: 13px;
}

.footer-links a:hover { color: #dfc66f; }
footer p { color: #d0d0d0; font-size: 12px; }

.copyright {
  border-top: 1px solid #5b4b24;
  margin-top: 24px;
  padding-top: 16px;
}

/* FLOATING WHATSAPP */
.whatsapp {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 99;
  background: #111111;
  color: white;
  border: 1px solid var(--gold);
  padding: 13px 19px;
  border-radius: 40px;
  box-shadow: 0 5px 22px #0002;
  font-size: 13px;
  font-weight: 800;
}

.whatsapp:hover { background: #303030; }

/* TABLETS */
@media(max-width:900px) {
  .nav { min-height: 88px; }

  .brand img {
    width: 130px;
    height: 80px;
  }

  .brand-text { letter-spacing: 2px; }

  .menu-button { display: block; }
  .nav-right { gap: 10px; }

  nav {
    display: none;
    position: absolute;
    top: 88px;
    left: 0;
    right: 0;
    background: white;
    padding: 18px 5%;
    border-bottom: 1px solid var(--gold);
    flex-direction: column;
    align-items: stretch;
    gap: 0;
  }

  nav.open { display: flex; }
  nav a { padding: 12px 0; }

  .hero-grid {
    grid-template-columns: 1fr;
    padding: 65px 0;
    gap: 30px;
  }

  .hero-art {
    min-height: 230px;
    border-radius: 100px 100px 18px 18px;
  }

  .hero-art-inner {
    width: 155px;
    height: 155px;
  }

  .hero-art .tooth { font-size: 57px; }
  .cards { grid-template-columns: repeat(2,1fr); }

  .about-grid,
  .contact-grid {
    grid-template-columns: 1fr;
    gap: 30px;
  }

  .journey-grid { grid-template-columns: repeat(2,1fr); }
}

/* MOBILE */
@media(max-width:540px) {
  .brand img {
    width: 100px;
    height: 72px;
  }

  .brand { gap: 6px; }

  .brand-text {
    font-size: 12px;
    letter-spacing: 1.5px;
  }

  .brand-text small {
    font-size: 8px;
    letter-spacing: 1px;
  }

  #language {
    font-size: 12px;
    max-width: 95px;
    padding: 8px 5px;
  }

  .nav-right { gap: 7px; }
  .hero-grid { padding: 52px 0; }

  .trust-grid {
    grid-template-columns: 1fr;
    gap: 17px;
  }

  section { padding: 60px 0; }
  .cards, .journey-grid { grid-template-columns: 1fr; }
  .card { padding: 23px; }

  .whatsapp {
    right: 12px;
    bottom: 12px;
    padding: 12px 15px;
  }

  .footer-grid {
    align-items: flex-start;
    flex-direction: column;
  }

  .footer-brand img {
    width: 80px;
    height: 60px;
  }
}
</style>
