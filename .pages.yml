
media:
  input: /
  output: /

content:
  - name: website
    label: Website Dent Way
    type: file
    path: content/site.json
    format: json
    fields:
      - name: site_title
        label: Titulli SEO
        type: string
      - name: meta_description
        label: Përshkrimi SEO
        type: text
      - name: hero_title
        label: Titulli kryesor
        type: string
      - name: hero_description
        label: Përshkrimi kryesor
        type: text
      - name: services_heading
        label: Titulli i trajtimeve
        type: string
      - name: about_heading
        label: Titulli Rreth Nesh
        type: string
      - name: contact_heading
        label: Titulli i kontaktit
        type: string
      - name: email
        label: Email
        type: string
      - name: whatsapp
        label: Numri WhatsApp
        type: string
      - name: instagram_url
        label: Instagram
        type: string
      - name: facebook_url
        label: Facebook
        type: string
      - name: hero_image
        label: Foto kryesore (URL)
        type: string
      - name: about_image
        label: Foto Rreth Nesh (URL)
        type: string
      - name: services
        label: Trajtimet
        type: object
        list: true
        fields:
          - name: title
            label: Emri i trajtimit
            type: string
          - name: description
            label: Përshkrimi
            type: text
          - name: price
            label: Çmimi
            type: string
      - name: gallery
        label: Galeria e fotove
        type: object
        list: true
        fields:
          - name: image
            label: Foto (URL ose rrugë)
            type: string
          - name: alt
            label: Përshkrimi i fotos
            type: string
          - name: caption
            label: Titulli i fotos
            type: string
