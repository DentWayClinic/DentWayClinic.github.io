
media:
  input: /
  output: /
  extensions: [jpg, jpeg, png, webp, gif, svg]
content:
  - name: website
    label: Website Dent Way
    type: file
    path: content/site.json
    format: json
    fields:
      - name: site_title
        label: Titulli i website-it
        type: string

      - name: meta_description
        label: Përshkrimi për Google
        type: text

      - name: hero_title
        label: Titulli kryesor
        type: string

      - name: hero_description
        label: Përshkrimi kryesor
        type: text
        
     
      - name: hero_title_size
        label: Madhësia e titullit kryesor (px)
        type: number

      - name: body_text_size
        label: Madhësia e tekstit (px)
        type: number

      - name: section_title_size
        label: Madhësia e titujve të seksioneve (px)
        type: number

      - name: logo_width
        label: Gjerësia e logos në kompjuter (px)
        type: number

      - name: logo_width_mobile
        label: Gjerësia e logos në celular (px)
        type: number

      - name: logo_position
        label: Pozicioni i logos
        type: string

      - name: logo_height
        label: Lartësia maksimale e logos (px)
        type: number

      - name: logo_margin_top
        label: Hapësira mbi logon (px)
        type: number

      - name: logo_margin_bottom
        label: Hapësira poshtë logos (px)
        type: number

      - name: logo_image
        label: Linku i logos
        type: string

      - name: color_primary
        label: Ngjyra kryesore
        type: string

      - name: color_secondary
        label: Ngjyra dytësore
        type: string

      - name: color_accent
        label: Ngjyra e theksit
        type: string

      - name: color_background
        label: Ngjyra e sfondit
        type: string

      - name: color_text
        label: Ngjyra e tekstit
        type: string

      - name: button_text
        label: Teksti i butonit kryesor
        type: string

      - name: button_color
        label: Ngjyra e butonit kryesor
        type: string

      - name: services_heading
        label: Titulli i trajtimeve
        type: string

      - name: about_heading
        label: Titulli Rreth Nesh
        type: string

      - name: contact_heading
        label: Titulli i kontaktit
        type: string

      - name: email
        label: Email
        type: string

      - name: whatsapp
        label: WhatsApp
        type: string

      - name: instagram_url
        label: Instagram
        type: string

      - name: facebook_url
        label: Facebook
        type: string

      - name: hero_image
        label: Fotoja kryesore
        type: string

      - name: about_image
        label: Fotoja Rreth Nesh
        type: string

      - name: services
        label: Trajtimet dentare
        type: object
        list:
          collapsible: true
        fields:
          - name: title
            label: Emri i trajtimit (Anglisht)
            type: string
          - name: title_it
            label: Emri i trajtimit (Italisht)
            type: string
          - name: title_de
            label: Emri i trajtimit (Gjermanisht)
            type: string
          - name: title_fr
            label: Emri i trajtimit (Frëngjisht)
            type: string
          - name: title_pl
            label: Emri i trajtimit (Polonisht)
            type: string
          - name: title_sq
            label: Emri i trajtimit (Shqip)
            type: string
          - name: description
            label: Përshkrimi (Anglisht)
            type: text
          - name: description_it
            label: Përshkrimi (Italisht)
            type: text
          - name: description_de
            label: Përshkrimi (Gjermanisht)
            type: text
          - name: description_fr
            label: Përshkrimi (Frëngjisht)
            type: text
          - name: description_pl
            label: Përshkrimi (Polonisht)
            type: text
          - name: description_sq
            label: Përshkrimi (Shqip)
            type: text
          - name: price
            label: Çmimi (opsional)
            type: string
          - name: featured
            label: Trajtim i veçuar
            type: boolean
      - name: gallery
        label: Galeria e fotove
        type: object
        list:
          collapsible: true
        fields:
          - name: image
            label: Rruga ose linku i fotos
            type: string
          - name: alt
            label: Përshkrimi i fotos
            type: string
          - name: caption
            label: Titulli poshtë fotos
            type: string
